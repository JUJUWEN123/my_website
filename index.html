            {

                jing: "会仙金灯、书堂贤迹、石翁长春、罗圈积雪、古栗老友、白祠山雨、山亭翠叶、摩诃出云\n浒泺薰莲、兔柴晴岚、峪胜去炎、玩湖夕照、醴泉漱玉、虎岩秋月、伏墓夕烟、印台午影",
                zhi: "邹平县志", dai: "康熙", lng: 117.7500, lat: 36.8300, guwen: ""
            },

八景：昆仑叠翠 孝水澄清 郑公书院 苏相石桥 丰源牧歌 万山樵唱 圣庙古松 禅林峻塔

圣庙古松：轮囷天骄，数千百年物也。

般水：自峪头河盘折而下，村峦林木， 为邑东南奥区，经城西南隅与孝水合流，具资名以此，其支流经东郭绕北城下仍入孝水。

昆仑山：横亘西南数十里，如张屏列阙，翠黛袭行人衣袂。

夹谷台：传为孔子相鲁定公会齐侯处，山巅平衍，可容干乘，岩间有洞，深不可测， 洞外巨石耸立，端冕垂绅俨然历阶而升，不尽一等时。

孝水：水经注所谓陇水也，源出颜文姜祠下，经县治北流至长山、新城等县入海。

三台山：县西南二十五里，三峰鼎立，异势同岭，览其郁秀，仿佛太华也。俗名支锅山，绀宇层叠，上下辉映，山势险峻。昔时避乱者全活多人，实一方福地，邑中胜境也。三峰鼎峙，秀削凌霄，下视范水，明如拖玉，最宜重阳登眺。

万山：邑南诸山，层叠不可名状，此山其最著也，金地院在其阴。

苍龙峡：群山之中，石壁割断，下有巨潭，相传龙盘其内，邑人祷雨辄验。

黉山;汉儒郑康成教授门弟子处，有晒书台故迹，至今树带草犹生，王樵茧室、鬼谷子洞在山后。

瀑水湾：石岩穹窿，悬流下注，湔湃有声，遥望之，如庐山三叠泉。

苏相桥：旁有苏相塚，石涧青蒲，寒泉茂树，行人憇息其间，多流连不能去。

焕山：邑西山突起，寺观最胜，山下诸泉岔流，迩日山市叠见。

长白山：范文正公继父朱文翰官于淄，公幼尝往來于此，为元人张临读书处，抱朴子所云七十二福地之一也。

青嶂泉：长白山南村一片独石，方广亩余，有泉出焉，流为巨溪，溅成瀑响，声闻数里。

青云寺：山回溪曲，密树高岩，名宾肄业寺中，往往成名云。

晴雨泉：巨壑悬崖如百间屋，泉自春而直下注，晴天疏雨，故名。

龙泉寺：一名燕窝寺，长白山畔，殿倚高岩，门前泉涌为塘，暑月荷花放时，柳幕草芮，不知仇池雁宕为何处矣。

放生矶：孝水西岸，石坡陀如虎阜，晓风杨柳，回流漩涡，濠濮间鱼乐处也，邑人生于此，立碑戒捕鱼者。

宝塔寺：塔高峻，四望廊如，孝水出其东，山岚崒，林木郁葱，称胜概焉。

萌山：邑西北，萌水所经，水浸山趾， 影澄泓照水中，风来习习欲动。

丰水：源出昌国城东南泉活头，即所谓德会水也，源阔数亩，涌为巨溪，虽雨涨不溢，又呼为猪龙河，邑人傍水建亭园，皆成胜概。

赵断沟：沟壁有洞，泉从中落，石磴穿洞，南上平台可眺也。

豹山：山之阳，石最雄奇，庙皆踞石上，其傍高下歆侧，如屋如席，山头磊磊族而居者，若为部落焉。

仙岩洞：名洞子沟，悬岩铁色，壁立干寻。南北相对，各立像祠，为黄冠修真之所，涧水西流，发源有石，平铺数亩，秋涨散瀑，恍虬龙翻浪，亦奇观也。

焕山山市记 张绂
盖闻神仙之说矣，三岛十洲，木公金母，渺茫而不可接也。抑闻梦寐之境矣，华胥槐安，旐鱼蕉鹿，虚诞而难为据也。岂非目所未见者，不可信为常乎？然亦有目可见而实非常者，若海市是已。按：海市见于蓬莱，夫人而知之矣，乃若山市者，四海九州，不多概见。惟吾邑焕山，相传以为往往有之。考邑乘所载，见者不过三四人耳。我不敢知，曰：“果山灵之独私此三四人欤？何见之者之稀欤？”念海市以登郡为称，首初未闻更有他处也。向者壬子初夏，偕同人游二劳山，遇雨，假宿青石涧。凌晨晴霁，过翻袁岭，矫首南望，倏见城郭楼台，旌旗人马，变幻顷刻，咸叱为异观。马间之士人曰：“此沧州岛现海市耳。”屈指计之，已逾数十年所矣。
惟兹丁卯暮春，余从太史唐公，为邑乘之役。昕夕共寝食者百余日。偶于六月五日辛亥，雨歇晚晴，同人缓步出村。突见西北一山顶方而色翠，固前此所未有也。俄而山势渐高，与历下㟙山相类。移时山忽中断，成两峭壁，对峙嶷然。迤南又起高峰，祠宇林木，辉映闪烁，而高树渐类人形。亟介马往观之，业已化为乌有矣。越七日，癸丑，于昨夕故处山复现市。突出三楼，北楼结构连云，南二楼巍峨鼎峙。有一人出楼门，望东招摇拜舞。倏而三楼化为三树，倏而三树复化为一山，较之目前所见，更为奇绝。一时观者无不骇目动心，鼓掌称快也。回忆向年海市见于雨余，今山市之见也亦复如是。大约谷王岳神，乃宇宙间灵秀所钟，惟雨后晴明，则天地阴阳之气，适符乎昭融清淑之机，故酝酿而成此异境耳。此亦理之固然，无足怪者。念彼渔父鲛人，日漂浮于海澨；而樵夫牧监，时棲迟于山陬，吾乌知不习见为常而不之异也哉？虽然在彼，故习见为常，而吾辈则乍见为异矣。昔孔子作孝经而赤虹见，今吾辈修邑乘而山市出，或者殆天诱其衷而示之应欤？则常也者而未使非异焉耳。爰为泚笔记之，以略述其梗概云耳。

淄川八景 明 陈时万
昆嵛叠翠

泉源胜地位于泗河源头泉林，以泉林泉群著称，孔子曾在此讲学，李白、朱熹等文人墨客亦有诗赞颂。泉林泉水清澈甘甜，有益健康。
位于泗河源头泉林，泗城以东二十五公里。泉林因名泉荟萃、泉多如林而得名。据记载，泉林有"名泉七十二，大泉数十，小泉多如牛毛"，昼夜涌流不息，涌流量达每秒1.35立方米，《山东通志》、《山东运河备览》都列它为"山东诸泉之冠"。至圣孔子曾在泉林设坛讲学，站在源头发出"逝者如斯夫，不舍昼夜"的感叹。北魏地理学家郦道元在《水经注》中誉之"海岱名川"。唐代大诗人李白"秋波落泗水，海色明徂徕"的佳句，宋代理学家朱熹"胜日寻芳泗水滨，无边光景一时新；等闲识得东风面，万紫千红总是春。"的诗篇至今传诵。故历代古人观赏之余感叹曰："游泰山不游泉林诚一大憾事"。清康熙、乾隆祖孙俩多次东行、南巡来山东曲阜朝圣到泉林观景，其中康熙一次，乾隆九次，并建有行宫，留下大量诗篇。从九四年起县政府为了保护这一珍贵的自然资源开始投资进行保护开发建设，恢复了大量景点，九八年泉林泉群风景区被省政府批准命名为"省级风景名胜区"。泉林古迹有 碑，石舫、御桥、古银杏树、子在川上处、泉林寺、三皇姑庙、行宫、虎斗坡、省级重点文物保护单位--古卞桥、古卞城遗址等多处。名泉有红石泉、珍珠泉、响水泉、黑虎泉、趵突泉、双睛泉、淘米泉、朝阳泉等，泉林泉水水质清冽，硬度低，纯度大，泉水无砷、汞、镉等有毒物质，饮用则甘甜爽口，煮茶则色清味正，酿酒则酒洌生香，常饮此泉水，能清心爽神，延年益寿。
安山春秀：
地处泗水县城东南十五公里，泗张镇北部，S244省道两侧，安山、马山、红顶山群山环抱。该景区主要有安山寺、涌珠泉、罗汉洞、千年银杏树、万亩桃园等景点。安山寺始建于唐代，现存大雄宝殿等遗址，依山傍水，环境幽雅。寺东有涌珠泉、海眼泉两处，泉水汩汩，久旱不枯。寺南有千年银杏树两棵，树围须六、七人方能环抱过来，是山东省排名第三的古银杏树。安山之阳悬崖处有六洞并列：三教洞（正大殿）、玉皇洞、十八罗汉洞、南海大士洞、观音娘娘殿、关公洞。安山寺南万亩桃园，每逢阳春，桃花盛开，遍地彤彤，蜂蝶飞舞，花沁清香，是泗水观光农业重要景点之一，每“泗水桃花节”游人超过10万人次。安山寺景区是我县的近期重点开发景区，安山圣源度假村、罗汉洞、桃园的进一步开发建设正在进行中。该景区四时有景，登临此处，环顾四野，青黛翠秀，听水潺鸟鸣，飘然欲仙，令人流连忘返。
凤仙叠翠：
位于泗城西北16公里，柘沟镇北风仙山。此山主峰玉皇顶是县内最高峰，海拔608米。凤仙山春天藤花遍地，夏日飞瀑流泉，秋天红叶满天，冬日苍松翠柏，一年四季，生机盎然。山中奇石参差，峦壑掩映，松柏相间，层峦叠翠。微风吹来，涛声入耳。现存有玉皇殿、文昌阁、泰山行宫庙宇遗址和朝阳洞、仙姑洞、圣水泉等景点，古人留下诸多诗篇和民间故事至今传颂。近年来，柘沟镇不断投入资金用于进山路、入口牌坊和景区内部景点、设施建设，功能日趋完善，游客逐年增多。现凤仙山已被批准为市级森林公园。
西侯幽谷：
地处泗城以北10公里，中册镇北龙门山。此山两峰并峙，横出天汉，宛如石门，夏季祥云霭霭，如龙吐雾。古人曾以此处云雾过门则雨故称"龙门灵雾"。明代张祚《泗池十景吟·龙门灵雾》道："西北双峰插泗滨，蒸蒸云气似龙津，甘霖旱慰苍生望，枯稿先回万象春"。龙门山中有赤龙潭、将军石、鸡冠山、故事井、未来香等自然景观。龙门山南麓原有灵光寺，始建于汉，金皇统二年（公元1142年）重修，寺院僧众百余名。惜寺院大部被毁，仅存观音堂一座。龙门山近年经过初步开发，建有进山大道、馆舍，并按地形层层筑坝拦蓄，形成连环水库，给此山大增灵气，植经济林和风景树300多亩，成为泗水山区自然风光和观光农业结合最好的风景区。
龙门灵雾：
此处群山相连，沟壑纵横，幽谷深邃，峰回路转，松柏蓊郁，蔽日清樾。最著名者龙抓沟、通天谷、响水沟。每至雨季，瀑布直下如白练飘垂，声响雷鸣，蔚为壮观。谷内怪石随处可见，如将军石、仙脚印、天池等。拐龙顶一块大石上的“仙脚印”一米多长，70公分宽，半米深，相传是杨二郎担山留下的足迹。在一块巨岩上，天然形成一池，长宽两米见方，深半米，池内长年有水，潦而不盈、旱而不涸，相传为王母娘娘下凡寻七仙女，路过此处，点石成池，浴罢而去。幽谷内有绵延近20华里的大型峡谷三条，扇形分开，龙骨张扬，被旅游规划专家称之为“鲁南第一大峡谷。西侯共有8条峡谷，呈扇形叉开，似龙骨张扬，而又忽然隐入山中，有高深莫测之感，故称之为幽谷，西侯名字则传说是因为孔子的儿子泗水侯孔鲤在这里生活过而得名。
圣山仙境：
地处县城东南20公里的圣公山。孔子曾游此山，故有此名。山中奇石纵横罗列，形态各异，奇、险、秀堪为"三绝"。有亭亭玉立、似舞非舞的"仙女石"，有饱经风霜的"老人石"，还有"青蛙石"、"卧牛石"、"晒书台"、"仙人座"等。树木葱茏，松涛阵阵，苍鹰排空，百鸟争鸣。登临极顶，近可鸟瞰乡村风貌，树绿瓦红，生机盎然，川川纵横相连，河湾水明。远可北眺泗河，良田沃野，连绵无际，楼房隐现缥缈，令游览者如入仙境。
长峰独峭：
位于泗城东南11公里，圣水峪乡东部藏风峪。长峰山因其东、西、南三面峭崖昂立，若城防然，故有神昌防之名。因其峰多、崖险、林茂、谷幽、洞深等自然美和神、祠、道、院竞设而闻名遐迩。此山有十大景点，最负盛名者为"峭壁千仞"，其峰峭壁如刀削，危崖悬叠，令人望而生畏。

济河烟雨：
地处泗河与济河交汇处上端的济河两岸。济河是泗河上游一大支流。此处两岸垂柳成行，绿荫排排，水中鱼呷鳞波，草木争翠，亭台竞巧。细雨 时，柔柳披风摇摆，似云烟缭绕。济河公园、仲庙和民俗游乐园就建于济河两侧，是泗水城区居民日常休息娱乐的最大场所。
华渚晓月：
位于大黄沟乡北，以华胥山、华胥池和月亮湾等自然和历史景观著称，华胥村是汉代泰山郡华县县城故址。

仙坛山：其首山日仙坛山，亦名凤山，又名玉带山。去城里许，邑之镇也。山体端严，中峰尤雄秀巍峨。每当晨初，朝晖甫上，浮翠欲滴。雨馀雪后，岚光映日，金碧层层，照城郭如画。而村落竹树，圉映炊烟，远近连青不断，上与山霭混合，一碧万顷。故邑八景以此称首选。
君山：君山，县北六十里。《述征记》：“承县君山有抱犊崮，壁立干仞，去海三百里。天气澄朗，海上望之，宛然在目。”一日抱犊山。平田数顷。昔有隐者王老，抱犊耕种其上，后仙去。因得此名。
青檀山：青檀山，县西七里，多产青檀，故名。一名云峰。宋南渡时，岳忠武常驻兵其下，后人题壁识其事。岁久，藓蚀不可辨。
刘伶台：又北十八里，曰寨山，南与大山。接其麓有土台，方广丈余，高数尺。土人以刘伶台台之。西为刘伶墓，巍然一大塚，村人岁时以酒脯祭之。

金堤春柳
柳色如烟，风吹柳枝轻拂堤岸
清・寿张知县 倪城《金堤春柳》“金堤蜿蜒接春流，柳色青青映碧洲。丝拂清波牵客棹，烟笼浅岸映村楼。农人引水浇新麦，稚子垂纶钓细流。最是一年春好处，东风送暖满田畴。”
运河秋波
波映秋阳，如碎金浮动
明・寿张文人 张鹏《运河秋波》“运河秋水碧如天，芦花飞雪覆河烟。渔舟荡碎斜阳影，牧笛吹残晚树蝉。两岸疏杨含晚翠，半汀残荷散清妍。偶来渡口闲凭眺，风送凉声满客船。”
古塔晴云
塔影映云，如浮天际
清・寿张贡生 王贵笙《古塔晴云》“宝乘古塔倚晴空，云影轻移塔檐风。碑侵藓迹文难辨，砖蚀苔痕色尚红。万里晴光浮野旷，一声啼鸟落天中。登临莫叹沧桑改，犹有残云忆旧宫。”
莲池秋月
荷风送香，月影如碎银
明・寿张知县 周以勋《莲池秋月》“莲池夜静月轮悬，清辉遍洒水中天。柳丝轻拂波心绿，荷影斜摇水底圆。渔火点点随舟泛，虫声唧唧伴客眠。此宵共赏中秋月，不羡瑶池作谪仙。”
古渡归帆
归帆连樯，落日映帆如金
清・寿张举人 杜楷《古渡归帆》“张秋古渡夕阳斜，归帆片片映红霞。漕卒唱歌催橹急，商船载货返京华。岸边酒肆迎过客，水上鸥鹭逐舟斜。我欲题诗记盛况，愧无妙笔绘繁华。”
贤祠夜读
灯影映窗，书声琅琅
清・寿张教谕 吕清《贤祠夜读》“贤祠夜静烛灯明，学子攻读趁夜清。书声琅琅传古巷，墨香阵阵透窗棂。柏阴覆院含秋气，月色满庭照客程。他年若遂青云志，莫忘寒窗此夜情。”` },

官桥即广济桥，跨卫运河，连接冀鲁，旧址在竹竿巷西卫运河河床内。晓月初升时，桥影映河，波光如练，为南北通衢之胜。
民国・临清文人 张树梅《官桥晓行》“卫水桥头月未沉，露寒沾袖晓风侵。波光映碎银千点，帆影牵愁客一心。冀鲁通衢人渐起，明清古闸迹犹寻。此行不为功名计，只为听钟到塔阴。”
津楼夜雨
津楼即启秀楼，位于砖城南门外、土城东水门内启秀津上（原玉音楼毁后改建）。夜雨时，楼檐滴雨伴运河水声，意境清幽。
清・临清教谕 刘阶平《津楼夜雨“夜雨潇潇滴津楼，运河涛声伴客愁。灯残案上诗犹在，烛冷窗前影自浮。魁星不语凝寒雾，闸水无声咽浅流。晓起凭栏看晴色，满堤烟柳绿初稠。”
塔岸闻钟
塔即舍利宝塔，在城北三里卫运河套内，九层八面砖塔，檐角悬铜铃，钟声传数里。夜泊舟者闻钟思乡，为临清标志性景致。
明・临清知州 马纶《塔岸闻钟》“宝塔崚嶒倚碧流，钟声云外自悠悠。清音日度三千界，梵响风传四百秋。开释几何名利锁，皈依多少去来舟。诸君设使登临望，足可烟消万斛愁。”
平岗积雪
平岗为北门外沙岗（今外贸公司北部），冬雪覆盖时，岗峦起伏如银，与运河冰面相映，素洁夺目。
清・临清贡生 温应瑞《平岗积雪》“北郭平岗雪满巅，茫茫一片接长天。沙痕隐现如藏玉，日色初融似泼铅。渔叟披蓑寻冻港，樵夫负薪踏寒烟。我来长啸临风立，疑是置身在剡川。”
南亭观化
在会通河西岸东夹道街南首，有土山，山上建‘观化亭’。登亭可览运河漕运与市井烟火，悟‘万物化育’之理。”
民国・临清县长 徐子尚《南亭观化》“土山筑亭俯长河，万物荣枯眼底过。春柳垂丝牵漕舫，秋枫燃火照渔蓑。市声渐远心逾静，云影初移意自和。悟得化机无内外，一杯清酒对清波。”
古槐阴井
在砖城威武门外林园村（今城东），古槐围长两丈，虬枝蔽日，树下有井，树影映井，夏日可避雨纳凉。
清・临清举人 刘昌《古槐阴井》“古槐如盖覆荒庭，树下寒泉映翠屏。虬枝蜿蜒疑龙卧，清冽甘醇可疗醒。影摇风动波生碧，暑退凉生客忘形。莫道寻常林下路，此中真意胜沧溟。”
泥寺春晖
泥寺即静宁寺，俗名泥陀寺，在州城卫运河东岸，元建明修，春日槐柏苍翠，香火与春晖交融。
明・礼部尚书 胡滢《题泥陀寺》“古刹临流映晓晖，春槐绕殿紫烟飞。千尊佛相凝庄严，一勺清泉洗是非。钟磬声传三里外，袈裟影落五云飞。我来瞻礼心逾静，暂借禅房悟玄机。”
东郊孤松
在城东陈坟村（今河西殷庄陈氏祖茔），明永乐年间植桧柏，叶有米粒、竹篾等五形，称‘五样松’，孤然挺立，苍劲古朴。
清・临清文人 王贵笙《东郊孤松》“东郊孤松倚墓田，虬枝盘曲欲参天。叶呈五样含灵气，干耸千寻接云烟。炎夏遮阳留客坐，寒冬傲雪伴僧眠。陈家先祖栽松意，千古清风满陌阡。”
鳌矶凝秀
在会通河与卫河分叉处，明永乐十五年建石坝如鳌头，四闸为足、广济桥为尾，称‘鳌头矶’。矶上有楼阁，春日花木葱茏，为运河胜迹。
清・临清知州 黄兆熊《鳌矶凝秀》“砌石为矶镇两涯，楼台拔地绕烟霞。东瀛吕祖仙人宅，南海观音大士家。近傍飞檐穷日御，遥看负郭满星槎。婵娟时伴笙箫舞，疑是金鳌谒翠华。”
凤岭钟英
凤岭即凤凰岭，在今大众公园南门旁，为运河清淤积土而成。乾隆南巡曾驻跸，岭上草木繁茂，喻‘地灵人杰’，故名‘钟英’。
清・乾隆皇帝《凤岭驻跸》“凤岭临流景自嘉，登高一望尽芳华。运河帆影连天际，卫浒烟柳映日斜。道观无尘凝晓露，民舍有乐起晨笳。此邦自古多俊杰，不负清时雨露赊。”`

清・乾隆皇帝《登光岳楼》“危楼百尺倚晴空，极目烟霄一望通。晚霞映瓦金流彩，晓日衔山翠拥红。卫水南来环古郭，汶河西去绕新宫。
登临岂是凭高意，欲察舆情四海同。”
铁塔烟霏
烟霏笼塔如仙境，铁佛凝霜映晓光
明・聊城状元 傅以渐《铁塔晨望》“铁塔凌霄接晓霞，烟霏轻笼梵王家。经文蚀石留唐韵，铁佛凝霜带宋华。海源阁畔书声近，卫水堤边柳色斜。我来凭吊思千古，犹听钟声送落花。”
东昌秋月
荷莲满塘，芦苇丛生，月色映湖如碎银，渔舟唱晚伴荷香
清・刑部尚书 任克溥（聊城人）《东昌湖秋月》“东昌湖水碧如油，秋月浮空影欲流。荷风送香侵客袖，渔歌隔水起汀洲。亭边柳丝牵愁绪，岸畔芦花映白头。此夜凭栏思往事，清光一片照神州。”
鳌矶朝晖
霞光映矶，水波如金
清・临清知州 黄兆熊《鳌矶朝晖》“鳌头独占两河间，朝晖初照景如燃。碧瓦映霞凝紫气，红墙沐日起青烟。闸开波涌通漕运，舟过帆悬接远天。我欲题诗赞奇境，愧无妙笔绘江川。”
运河古渡
渡口石阶层层，柳荫蔽日，漕船往来如梭，橹声咿呀伴涛声，帆影参差映碧水
明・东昌知府 胡德琳《运河晚渡》“运河渡口柳丝柔，晚渡人归古渡头。帆影渐随残照没，橹声犹带夕阳流。客登舟楫寻归径，渔撒银网起白鸥。此境不输江南好，一川风月足清幽。”
松涛暮韵
松涛阵阵如琴瑟，暮日映林如丹
清・聊城文人 张树梅《傅宅松涛》“傅家宅畔柏森森，暮韵松涛入耳深。贞默堂前书迹在，状元祠里墨香沉。夕阳映叶凝秋色，冷月疏枝带露痕。我来拜谒思遗泽，犹见清风满故林。”
会馆灯火
馆内灯火璀璨，戏楼唱晚，灯火映运河，歌声传数里
清・河东河道总督 杨以增《山陕会馆夜观》“会馆巍峨映夜灯，晋商秦贾聚良朋。雕梁绘栋藏风雅，戏楼歌板伴涛声。灯火万点连漕运，酒旗千杆映卫城。此夜繁华谁可比，江北商埠数聊城。”
孟母遗风
堂前植槐柏，台侧有断机石，槐柏苍翠，碑刻映日

以城西骆驼山为核心，此山虽为土阜，形似伏驼，夕阳西下时，余晖洒于山巅，土色如金，与山周柳林、田间炊烟相映，“驼峰映霞，如入画境”。山巅曾有龙王祠，明清时乡人常于此登高赏秋。
清・堂邑教谕 李际明《驼山晚照》“伏驼横卧夕阳斜，漫卷霞光覆浅沙。祠畔柳烟迷客路，田边禾黍映人家。风传牧笛归村晚，露湿疏星坠岭赊。谁道此山非胜境，秋来尽可醉流霞。”
马颊秋波
马颊河堂邑段秋日景致，河水澄清，芦花泛白，岸边芦苇荡间常有渔舟往来，渔人撒网时 “波映秋阳，如碎金浮动”；河畔柳色虽疏，仍有残荷点缀，尽显 “秋水长天” 之韵。
明・堂邑举人 张养浩《马颊秋波》“马颊秋来波漾金，芦花如雪覆河心。渔舟荡碎斜阳影，牧笛吹残晚树阴。两岸疏杨含晚翠，半汀残荷散清砧。偶来渡口闲凭眺，风送凉声满客襟。”
古寨朝烟
城东南古战场遗址，清晨薄雾缭绕残垣，村舍炊烟自寨址周边升起，与朝霞交织，“荒寨隐烟，如忆古战”；遗址内曾出土青铜箭镞，明清时为文人凭吊古迹之地。
清・堂邑知县 胡德琳《古寨朝烟》“荒寨残垣接晓烟，平芜漠漠忆当年。箭头锈尽埋秋草，垒迹依稀认故阡。雾锁颓墙迷鸟道，风传野笛入云边。可怜战国干戈地，今日耕桑满陌田。”
清凉晓钟
城西清凉寺晨景，寺内大钟每日破晓鸣响，声传十里，与寺外古柏、晨露、村犬吠声相融，“钟鸣清晓，涤荡尘心”；明清时学子常闻钟而起，赴寺旁书院读书。
明・堂邑文人 许延用《清凉晓钟》“古寺钟鸣破晓天，清声遥送野云边。柏阴露湿僧归径，竹院风轻客扣禅。十里村墟皆唤醒，一林烟景共澄鲜。年来久厌尘嚣扰，愿借钟声伴静眠。”
莲池月色
城东北 “莲子池”夏夜景致，荷叶田田，荷花盛放，月色映于池面，“荷风送香，月影如碎银”；池畔有 “赏月亭”，文人常于此宴饮赋诗。
清・堂邑贡生 温应瑞《莲池月色》“莲池夜静月溶溶，露湿荷风送暗香。影覆清波疑坠玉，光摇疏叶似凝霜。亭中客醉谈今古，池畔蛙鸣伴浅塘。此境堪怜须记取，莫教辜负好秋光。”
柳岸春荫
马颊河沿岸春日景观，河岸植柳万株，暮春时柳丝依依，绿荫蔽日，行人漫步堤上 “柳影随波，清风拂面”；堤旁时有农人春耕，牧童骑牛而过，尽显田园生机。
明・堂邑知县 王应乾《柳岸春荫》“堤柳垂丝覆绿波，春风吹暖鸟声多。行人借荫寻前路，农父驱牛耕野坡。影蘸清波摇翠带，絮飞晴日点青莎。年年此景关情处，醉倚斜阳听牧歌。”
古塔晴云
城西南 “兴国寺塔”晴日景致，塔身虽残，仍显古朴，晴空时云影绕塔，“塔映晴云，如浮天际”；塔旁曾有碑刻，记载隋代建塔缘由。
清・堂邑举人 李观《古塔晴云》“隋塔残基倚晴空，云痕轻逐塔檐风。碑侵藓迹文难辨，砖蚀苔痕色尚红。万里晴光浮野旷，一声啼鸟落天中。登临莫叹沧桑改，犹有残云忆旧宫。”
萧寺晨霜
城东萧寺冬日晨景，寺内古槐覆霜，石阶凝白，晨钟鸣时 “霜映晨光，寺如素裹”；寺外麦田覆霜，农人踏霜耕作，尽显冬日清幽。
清・堂邑文人 侯居冲《萧寺晨霜》“萧寺清晨覆晓霜，古槐疏影映回廊。阶前冻叶凝寒白，殿角残灯透冷光。僧扫霜痕开竹径，农驱牛犊出茅堂。此中真意谁能解，静对寒林思渺茫。”` },
            { name: "博平", fu: "东昌府", jing: "会通帆影、莲池秋月、故台夕照、古塔晴云、津楼晓日、郊园春色、石桥夜月、奎楼晚眺", zhi: "博平县志", dai: "道光", lng: 116.1000, lat: 36.5600, guwen: `会通帆影
京杭运河（会通河）穿博平境，昔年漕运繁忙，帆影连樯，商船、官船往来不绝，岸边酒肆、货栈林立。
明・博平知县王珣《会通帆影》：“长河如练绕孤城，帆影参差映日明。漕卒唱歌声不断，满船粳稻入燕京。”
莲池秋月
县城南 “莲花池”，周长三里，夏荷满塘，秋日月色映池，荷香袭人，明清时为文人赏月宴饮之所。
清・博平举人刘世俊《莲池秋月》：“池面风来送晚香，月华如水浸莲塘。渔舟唱罢人归后，惟有残荷映冷光。”
故台夕照
县城西 “鲁仲连台”（战国鲁仲连隐居处），台高丈余，夕阳西下时，台影斜长，士人登临多感怀鲁仲连 “义不帝秦” 气节。
明・博平教谕张天赋《鲁仲连台夕照》：“故台残照里，犹忆鲁连贤。排难全赵国，辞封不受钱。清风千古在，明月一轮悬。谁继高风者，空嗟世态迁。”
古塔晴云
县城内 “铁塔寺塔”（宋代建），塔高七层，通体铁铸，晴空时塔影映云，故称 “古塔晴云”。
清・博平知县金一凤《古塔晴云》：“铁塔凌霄接碧穹，晴云缭绕影重重。千年古寺钟声远，唤醒人间名利翁。”
津楼晓日
运河岸边 “望河楼”（津楼），晨日东升时，楼影映河，金光闪烁，故称 “津楼晓日”。
明・博平举人傅光宅《津楼晓日》：“津楼高耸接朝霞，晓日初升照浪花。千里运河通楚蜀，一帆风送万人家。”
郊园春色
县城东 “东郊园”（明清私家园林），春日桃李盛开，牡丹、芍药争艳，游人如织。
清・博平邑人王道增《郊园春色》：“东郊春日满园芳，桃李争开映短墙。蜂蝶纷纷来又去，东风吹暖百花香。”
石桥夜月
县城北 “石拱桥”（明代建），月夜时，桥影映河如弓，行人过桥，月影随步移动，故称 “石桥夜月”。
明・博平知县杨其廉《石桥夜月》：“石桥横卧夜沉沉，月照清波映客心。不用扁舟寻范蠡，此中自有五湖心。”
奎楼晚眺
县城东南 “奎星楼”（清代建，祀奎星，主文运），楼高四丈，登楼远眺，四野旷阔，夕阳西下时，城郭、田畴尽收眼底。
清・博平举人孙廷铎《奎楼晚眺》：“奎楼晚眺意悠悠，落日余晖满沃畴。冀北燕南皆入望，此身疑在碧云头。”` },

圣庑灵槐:大成殿前有槐，名灵，枝柯盘旋，其形如龙，覆盖其上，时有紫云，每逢天阴能见其形。
连村烟市:城之东北望鲁店前，仲连故址，村落连绵，遇雾溟濛，隐有人烟，海市蜃楼，望之俨然。
茌巅酒泉:茌山之沿，井有香泉，汲之酿酒，酒气自然，虽在丁塊，亦如井泉，丁塊名酒，本此来源。
孟馆清风:东郭门外，孟子驻处，清风徐来，时在盛暑，驻足当之，醒人心绪，飒飒而来，莫之所与。
草堂书声:马氏夜读，学宫之东，人烟已渺，遗址亦空，每逢夜半，隐然闻声，驻足听之，宛如冬烘。
梁原霁雪：城东二里有元墓，每当隆冬有雪，凝结积至春深，不消不减，夜尽更深，可以映月。
髡林夕照：城西里许，淳于髡墓，古木森竦，相间参参。夕阳返照，树影流丹，驻足望之，蔚然奇观。
附：以下是一组关于茌平县八景的七律诗：
 
其一 马庄春雨
东郭烟村水汽生，桃红柳绿露华莹。
谁教霈泽春宵降，天赐膏腴祥瑞呈。
火色鸢肩知造化，白麻紫诏沐恩荣。
客来故里同瞻仰，多少抚今怀古情。
 
其二 圣庑灵槐
文庙巍峨耸碧空，灵槐千载郁葱葱。
枝柯盘曲龙形隐，云雾蒸腾瑞气融。
每至阴天姿更显，常逢墨客韵偏工。
沧桑阅尽情依旧，护佑黉门世代崇。
 
其三 连村烟市
遥看水气罩平畴，车马衣冠出蜃楼。
烟市乡闾传百代，祠堂父老祭千秋。
解围赵国真雄辩，飞矢聊城好运谋。
谈笑谢金挥手别，东归沧海自垂钩。
 
其四 茌巅酒泉
茌山侧畔气浑仑，天赐甘泉出石根。
碧甃夜闻声若佩，清波晨挹色如琨。
潜来平陆丁家块，酿入朝堂白玉樽。
莫道谪仙诗百首，管教一斗醉烟村。
 
其五 孟馆清风
当年孟子驻行踪，古馆清幽绿树浓。
夏日气凉消溽暑，闲时意适觅遗踪。
森森草木传佳韵，习习襟怀仰雅风。
千载流芳名不没，犹闻仁义响晨钟。
 
其六 草堂书声
茌山旧馆忆前贤，静听书声夜不眠。
翰墨流芳思兴祖，儒风继世仰英贤。
虽无冠盖盈门第，却有诗章启后筵。
岁月悠悠情未了，琅琅音韵绕林泉。
 
其七 梁原霁雪 
冬来万顷绽梨花，春至登高望霁华。
孟馆门前犹积玉，梁原渚外更堆纱。
初晴赑屃寒风度，向晚松楸落景斜。
元代尚书标故里，还教清越映人家。
 
其八 髡林夕照
千年遗冢傍烟村，夕照沙丘若有魂。
缥缈云霞知放鹄，参差草木解留髡。
郢中使者真难得，稷下诸生孰可论。
莫道出身齐赘婿，日听炙毂过陵门。`

清水晚吟 姚本
清水城头日欲落，清水城边烟漠漠。
日光蘸水水沉烟，烟水澄凝碧如濯。
空月倒浸城上楼，楼上天云水底浮。
城下行人漫兴思，援笔对景书狂讴。

奎楼 周延光
楼头奎璧渺云端，隐隐累累驻槛栏。
闪烁珠辉天外落，光芒剑气望中看。
跻攀直欲探霄汉，翘举应知插羽翰。
遥望三台高烛处，为题毫彩喜弹冠。

楼阁冲飞接玉京，屹然文笔峙孤城。
窗含泰岫风云壮，廉卷洙源雨露清。
春煖沙堤看跃马，秋高溟海快抟鹏。
纵知奎聚人文兆，直与霄烟共纪名。`

熙熙台：在今治衙署后城垣上，盖取老子“众人熙熙，如登春台”之意。《齐乘》云不知创于何代，想其来远矣。土人相传县署系古丛祠地，大门侧旧有鼓楼，而熙熙台乃其后院也。
望海台：俗名黑塚，在今治东北五十里黑塚庄侧。此台即汉平望县故城，又俗名圣母台。《方與纪要》：“望海台，秦始皇所筑，盖升以望海者。”或命名所由昉也。台今已圮废，仅遗址存。
仓圣墓：在县城大西门外，迤北百步许，久为一邑名区。墓前东西有井二，昔所谓仓颉双井也。
呙宋台：在今县城南十五里，命名之义无所考。台前数十武，相传古神人埋一巨釜于下，湮塞海眼。
盐城：亦名霜雪城，在今县城西北六十里清水泊之侧。此城日久陷没于巨淀洼中，隐隐微露城阙。必待雾露之候，青蒙气照之，影小为大，仡仡崇墉，始觉仿佛可观。土人因以霜雪城名之。
[明]张僎

熙台秋月
[清]李振栝
溶溶月色照熙台，为爱清秋玉宇开。 冷艳蟾光生粉堞，婆娑桂影印苍苔。 
天风乍忆凌虚度，海气真当附郭来。 忧乐同民归大尹，登临得不重名才。
望海崇台
[明]张僎
祖龙望仙台，崇名徒干尺。 
鳌戴蓬壶静，鲸波金阙隔。 
夜间风雨声，仿佛鞭驱石。 
望海台
[清]李登龙
祖龙东幸日，望海起崇台。 
蹑步青云近，迎眸碧落开。 
波身连大漠，潮响隐晴雷。 
岛屿浮云出，鼋鼍驾日来。 
独怜徐福去，不见采芝回。
望海崇台
[清]李振栝
台高百尺广天风，大海遥瞻气象雄。 平望分茅衍世系，祖龙鞭石破鸿濛。 
遗踪寂寞归流水，旧事凄凉付转蓬。 眼底沧桑成变相，几回凭吊夕阳红。 
望海台
[清]严胤肇
高台望不见，秦地此登临。 
万乘旌旗动，三山波浪深。 
荒城余旧迹，少海洗雄心。 
怀古空惆怅，乾坤几陆沉。
仓颉双井
[明]张僎
书契一泉源，万年汲无碍。 
篆隶演屡迁，真草流迭代。 
同文收勿幕，趋时神力在。 
仓颉双井
[清]李振栝
干秋胜地结灵光，古井双开依墓旁。水面风云呈色相，字中蝌蚪铸文章。
精魂绕与词源近，挹注能令道味香。为揽长绳取玄酒，殷勤洗盏吊斜阳。
宋台神釜
[明]张僎
淮渎锁支祁，大哉神禹力。
神釜镇海眼，恍惚难解惑。
我欲发掘平，幻真将焉匿。
宋台神釜
[清]李振栝
地脉通灵釜亦神，谁留韵事已干春。 台高百尺迎初日，水彻重泉绝点尘。 
海上奇谈原不误，人间胜迹易成陈。 于今方外来司马，莫讶城南草色新。
周疃海市
[明]张僎
海市变怪多，周曈沧溟侧。 
远望万家呈，搏之不可得。 
蜃气似楼台，神理谁能测。 
周疃海市
[清]李振栝
渔村放眼依中流，蜃市谁开一望收。 
络绎人烟风雨集，喧阗车马往来稠。 
分明贝锦连三岛，仿佛珊瑚列十洲。 
今古沧桑多变幻，忘机却羡海边鸥。
雾现霜城
[明]张僎
中流象假城，人物氤氲幻。
非有亦非真，水月镜花现。 
荣华烟景笼，真妄谁能辨。 
雾现霜城
[清]李振栝
薄雾连天逼早行，郁葱佳气一时生。空中楼阁惊存没，眼底封疆乍灭明。
几欲临风夸壮丽，无缘载笔赋恢弘。从来世事浑如梦，恍惚今朝入化城。
王高银刹
[明]张僎
古塔半天起，隆冬酒飞雪。
彤云笼孤峻，玉峰耸皎洁。
神境会双清，冷风吹冻月。 
王高银刹
[清]李振栝
古塔峥嵘百尺高，六花装点脱尘器。 光芒十里摇银海，皎洁三冬碎玉毫。
月照空寒留净宇，僧依冷淡类闲曹。 我来领略斜阳外，便是无诗兴亦豪。
星落石臼
[明]张僎
系绝积气光，臼仍悬象迹。
庸人飞上天，持忤舂星魂。
殆信补天者，果炼五色石。 
星落石臼
[清]李振栝
海字村名系落星，幽人选胜此留停。 谁操玉杵回天象，似借高春揭地灵。 
久识奇文镌石鼓，从教紫气焕青萍。 寒烟漠漠凌风雨，常伴松根老茯苓。` },
            { name: "昌乐", fu: "青州府", jing: "剧县春晴、营丘夜雨、黄村黍熟、白石花飞、龙洞云开、马山雪霁、孤峰夕照、方水朝烟", zhi: "昌乐县志", dai: "嘉庆", lng: 118.8300, lat: 36.6900, guwen: `剧县故城：在县西六里。汉置县，属北海郡。又名剧南城。
白石泉：在阿陀镇东，白石庄东一小溪，沿溪而北数十步，溪西岸有悬崖。石淡白色，自西而东，宛如卧龙昂首。崖下一泉自石壁上出，水流㶁㶁，入坎激湍，四无荫翳。仰见白石，日光射之，水光上激，错落成文。如飞花滚雪，横斜攒簇。旋落旋起，重叠万状。诚天造奇观也。
龙洞：城东南十里外，孤山。特起一峰，壁立千仞，为邑东保障。城脉盖由此焉。山西南有穴，曰龙洞。祷焉，辄雨。
马山：自孤山之阳而东，曰虎埠；又东里许，曰马山。
方山：距城二十里，边下镇之正东。其山横亘，顶平如坻，四望皆方，故名。山半有神祠，神台座下有古洞，其深莫测。祠前石池深可六七尺，冬夏不溢不竭，内畜金鱼。池畔古槐绕藤，绿竹夹道，紫薇黄杨罗列左右。遇旱，虔祷辄应。

剧县春晴 于子仁
剧县春晴满县花，风光浑似楚天涯，
当今潘令新官诰，前渡刘郎老鬓华。
桃李门墙嘶骏马，秋千庭院隐啼鸦，
多情最是衔泥燕，飞入青帘卖酒家。
营丘夜雨
入夜淋漓雨未休，可怜孤枕卧营丘，
当年茅土全归汉，今日山河不是周。
鸡唱五更乡梦断，鸟啼三月故人愁，
今来古往都相似，霸楚强秦枉自谋。
白石花飞
冈头白石乱花攒，石上花飞缀锦斑，
初讶鹤归王母洞，恍疑羊起石城山。
补天五色朝霞灿，扣角三更夜雨寒，
早晚束薪来共煮，照人光彩绚金丹。
黄村黍熟
秋风田野说嘉禾，井里丰穰九里歌，
暮雨人家蒸酿熟，日晴宫府运输多。
柴荆门下眠黄犬，桑枣园林晒绿蓑，
向晚一声何处笛，牛羊群队下山坡。
龙洞云开
洞里云开洞里春，洞中多少避秦人，
蛟龙蟠处迷风雨，雷电惊时有鬼神。
泰岱千层连锦障，蓬莱五色觐枫宸，
圣恩若许归田里，拟结茅庵作近邻。
马山雪霁
连朝风雨浩漫漫，又喜新晴上马山，
幽涧结冰初破玉，断桥流水渐拖蓝。
何人访友乘舟去，此日寻梅载酒还，
却忆渭川千亩竹，夜深童子报平安。
孤峰夕照
孤峰倒影大桥西，翠抹岚光望不迷，
几片落霞真画屏，半天残照好诗题。
斜坡童唱驱牛下，远树烟含待鸟栖，
二圣祠前云渐合，晚风犹动草凄凄。
方水朝烟
几缕朝烟瞑色收，水光澄澈晓光浮，
和云笼树添诗债，漾日成纹佐客瓯。
有本源通沧海润，无波神护碧天秋，
何人吸取池中水，噀与苍生洗旱愁。` },

            { name: "诸城", fu: "青州府", jing: "超然四望、琅琊炊烟、马耳腰云、韩王坝月、五莲晚翠、九仙朝霞、龙潭雷声、卢洞清风", zhi: "诸城县志", dai: "乾隆", lng: 119.4000, lat: 35.9900, guwen: `琅琊台：《史记》：“秦始皇二十八年，登琅琊，大乐之。徙黔首三万户琅琊台下，作琅琊台。”《水经注》：“台孤立，特显出于众山，上下周二十余里，傍滨巨海。台高三层，层高三丈，上级平敞，方二百余步，高五里。”
超然台：在县治西北城上。详苏轼《超然台记》，后人即是，为苏公祠祠之。
马耳山：山在县西南五十里，苏轼诗所云“双尖”，其中峰也。
五莲山：在九仙东五里，本名五朵，九仙之别峰也。明神宗敕建光明寺，赐名五莲，始自为一山。
九仙山：县西南八十七里。《山东通志》：“汉明帝时，有九老日饮酒万寿峰下，一日同化去，人称为仙。”又传苏氏兄弟九人，在此山误餐异人哇食，同仙去。
卢山：在县东南三十里，为县主山。汉《地理志》之故山也。山以卢敖得名。前阿有休粮洞，洞之左有圣灯岩，西巅有石名饮酒台，皆敖遗迹矣。` },

            { name: "博山", fu: "登州府", jing: "黑山暮雨、峨岭晴岚、孝水澄清、阳坡绕翠、禹山积雪、仙洞藏春、秋谷高风、珠泉印月", zhi: "博山县志", dai: "民国", lng: 117.8400, lat: 36.4800, guwen: `黑山：城东十六里，石色黑，煆而为铁，一石得二斗，冶器取资焉。又多煤炭，故名。巅有泉，色白而浓，味甘如江水，俗因呼为江米泉。
峨岭：在县城南。山形秀曲如眉，一名峨眉山。环抱城垣如屏障。上有石峰矗立，名曰文峰笔，又名文昌庙。新建泰山行宫。
禹山（禹王岭）：杂记镇志皆称禹山。在县西十六里，原山支阜也。岭有二，在山东南者为王大岭，东者为王二岭。时有云气浮浮，带其苍岫，雨则先起，晴则后散。土人與此占雨候焉。
陇水（孝水）：古袁水也，见水经注。因孝妇感灵泉之异，一名孝水，又名孝妇河，见宋史。陇，水经注又作瀧。晋郭缘生有缉籠之说，复称籠水。颜山杂记辨其诬。今俗名孝妇河，出县西南凤凰山南麓下灵泉庙内。其源清澈静闷，池深丈余，流出成河。
圃山（吕仙洞）：在凤凰山之右，相距二里余。山势长展如屏，顶圆，凝重，故名。上有吕仙洞，颇饶林泉之胜。（吕仙洞）在圃山西阜巉岩下，中设吕仙像。对崖即圃山泉，盈盈助胜。
秋谷：在荆山麓。宋范文正公寄迹处。公父为淄青记室，客死，公少孤，青于长山朱氏，尝读书长白山醴泉寺。秋谷接迹长白，实为胜地，故往来于此。其上有洞，见祀典志。
修复范公祠记
沈廷芳
博山县城东，东山之秋谷有泉焉，范文正公微时读书其上，后人名之曰范泉，筑堂曰范氏书堂，祀公，历有年所。乾隆十四年冬，予登山展谒，祠已为文昌阁。县故有文昌阁，在峨岭之椒。其乡先生赵赞善执信，以其路迂而僻，公祠适颓，遂拓其址以祀文昌神，亦崇文教意也。予谓公少有志操，即以天下为己任，则于文教功正钜。且地以公著祀，公久，宜复其旧爱。属县令杨君甡重葺之，摹益都官廨所藏公画像于堂中，而归文昌像于峨岭。
明年十月朔，工告峻。予至博山，特斋宿，具牲醪，率将吏、乡大夫、士，敬拜祠下。祇肃骏奔，罔不欢忭。公之神灵庶几鉴之于乎？公之神固无乎？不在矧侑，享孔亭祀于其乡暨宦游地。其在山左，则长白山、醴泉寺、青州郡城之三贤祠，皆足以崇德报功，讵独藉兹山之石？予之复公祠，盖重公息游之区，有其举之，莫敢废也。古之人入庙思静，展墓思哀，登公之祠，不可抒仰企之忱，而使此邦人士胥观感，以志公之志，学公之学乎？至公之生平，耿著史册，其山川之形胜，堂廡之规模，则故相孙文定公《颜山杂记》述之已详，故不著。
祀事既成，余憩泉北之敬一堂，其乡大夫、士来谒，且告曰：“斯泉之阳，曩有草书‘山高水长’四字碑，为明张硕隐先生笔。赞善移置秋谷河崖下，临深渊，恐久而崩坠。公既复范公祠，盍以碑还故址，俾勿坏。”予如其请。按：张，名中发，字智鹄，号伴鹤翁，淄川人，有潜德。硕隐，其乡人私谥云。
秋日登禹山绝顶 孙宝仁
秋深山愈静，南望海天影。
穷年见此山，未历山中境。
选胜发西郊，极目心神骋。
五里踏平冈，十里更越岭。
岩趾渐突兀，拾级心时警。
数折戾云霄，屡被危崖梗。
却里眷东瞩，烟中开万井。
阳阿辨居人，茅茨疏以整。
出谷日已晡，登峰余返景。
山势垒千盘，台沓会一顶。
神禹庙貌存，石甃香台迴。
樽罍亦已具，野烧还沦茗。
呼吸通帝座，凌空如泛艇。
飒飒天风吹，西南岱色冥。

秋杪登禹山绝顶 孙宝仍
须鬓惊心送酒杯，为怜秋老更登台。
苍茫木叶千山远，惨淡浮云万里来。
雨过翠屏含日霁，霜残寒菊傍岩开。
狂歌剩有登临兴，谁似当年作赋才？

岁暮饮秋谷园亭 赵进美
树暗溪声绕，山明日气衔。
云霞寒入座，冰雪静依岩。
谢客乌皮几，长歌白木鑱。
薜萝春欲发，三径莫全芟。

秋谷夜雨 赵执信
幽栖清梦著烟罗，奈此秋霄积雨何。
岂是乱泉添响急，非关深谷贮风多。
千峰势极趋沧海，三径心期接缝河。
情兴尚堪冲晓在，满林飞瀑满溪波。

范公亭 孙廷铎
闲亭独对荆山们，亭下清泉漱石根。
一代共推如管葛，当年谁肯问王孙。
长留片石云对树，剩有茅堂水绕村。
芳草斜阳空自语，先忧后乐向谁论？` },
            { name: "宁海（牟平）", fu: "登州府", jing: "范园春晓、牟台秋望、昆嵛叠翠、卢峰霁雪、石洞烟霞、龙池喷雪、荆岩古寺、白塔斜阳、龙门归帆、海市云收", zhi: "增修登州府志", dai: "光绪", lng: 121.6000, lat: 37.3800, guwen: `范园春晓：
范园，在县南二里，金状元范怿之花园，范尝与马丹阳高巨才等，宴集其中，有归山操琴碑，金大定二十三年丹阳马钰书；又有玄都宫碑，元宪宗八年高晔撰。园中有怡老亭，今圮。
牟台秋望：
牟台，在县东北三里。地势高敞，便于登临山海，州志以【牟台秋望】列十景之一。相传为牟侯别墅，土人称为东牟郡。
按东牟郡系登州全属公称，（唐宋地志，均系州郡并列，登州即称登州东牟郡。）郡治久设于蓬莱，登州何以亦称东牟郡？查唐如意元年、曾在牟平设登州治，至神龙三年，始徙治蓬莱，或者牟平设郡治时称东牟郡，徙治以后，仍相沿不改，故指牟台以为纪念欤？或云【因东牟侯而言。】义亦近之。但东牟本系汉县，何以得称为郡？殊属疑问。
昆嵛叠翠：
昆嵛山，在县东南四十里，一名根余。崔鸿十六国春秋言：【晋永嘉中，曹嶷据青州，石勒遣石虎来攻，嶷欲徙海中，保根余山。】即此。山横亘牟平、文登二县界，南北约百里，东西约八九十里，为海上诸山之祖。齐承云：【南岱东沂之外，沂之蒙山，密之九仙，即墨之大小劳，宁海之姑余，般阳之长白，皆三齐之高大名山也，余不得并列。】金朝散大夫国称记曰：【昆嵛麻姑洞天也，诸山绵亘相属，秀异峭拔，为东方冠。】王渔阳池北偶谈云：【昆嵛山有山市，恒在清晨，遥望之山化为海，惟露一岛，岛外悉波涛弥漫，舟船往来山下，人但觉在雾气中。】州志以【昆嵛叠翠】列十景之一。

石洞烟霞：

            { name: "昌邑", fu: "莱州府", jing: "青峰凝翠、潍水环清、西岩晨旭、东山晚照、游沼荷香、震台月霁、仙园遗笔、古庙奇槐", zhi: "重修昌邑县志", dai: "乾隆", lng: 119.4100, lat: 36.8600, guwen: `青峰凝翠：青石之山，石径岠嵚，冈峦耸峙。每屐齿高寻，山头横黛，欲抹苔色，烟光苍然，入目实擅东南之秀。

玉泉枕流乃蒙山胜景之一，时人演绎为蒙阳龟蒙景区八景之一,其实应为费县古十景之首，在上冶镇东，为玉泉观枕流亭所在也。玉泉观位于上冶镇东岭，西临紫荆河，此地原为玉泉书院，枕流亭即为玉泉书院内之建筑。清光绪《费县志》载：亭建于明万历三十八年，由礼部主事沂州人周京所建。清道光十一年秋，上冶人贡生任敏秀重修。壬辰秋分，余假道上冶，由冯增芬女士引领探访。此亭尚在，座北向南，砖壁瓦顶，四角飞檐，临泉而建。亭内北壁刻翟云升“枕流亭”三字，右刻高密人王烻作并书《重修枕流亭记》、《题玉泉观》诗两首，左刻清贡生任毓秀作并书《浚玉泉并重建枕流亭歌》。
桃源仙景：
许家崖的仙人洞。仙人洞，在费县城南15公里处的许家崖乡以东，玉环山之阳，有古庙一座，曰丛柏庵，创修于明嘉靖十六年（1537）至三十七年（1558）。重修以后，又逾2年，始立玉环山丛柏庵碑记，今犹可考。及至清代，屡次重修，载之甚详。庙宇中有玉皇殿、泰山殿、关公殿、灵官殿与金姑殿等。近百年来，迭遭战乱，相继倾圮。
此地悬崖环列，危岩欲坠。上有苍松围绕，下有银杏凌空，林木茂密，青苔掩映，山光岚气，令人迷恋，故历代游客共推胜地。丛柏庵北有深邃山洞，可容千人，半明半暗，幽曲穹窿，南北两门，中间相通，还有天窗，上下两层。三伏盛夏，洞中寒气袭人，入内小憩，气爽神清，别有天地，犹如仙境，因名仙人洞。

清・唐仲冕《龙沼春霖》：“苍龙蟠蛰白云隈，龙跃云飞碧涧开。风满危亭波不乱，镜澄方沼月初来。秋深远映山头翠，春澍先闻地底雷。啜茗细吟白雪句，羡君卓是济时才”
书院秋风
清・史廷桂《书院秋风》：“赭磴苍崖石室孤，秋风十里涧芹芜。香吹书带枯阶草，道契麟符礼壁图。蠹字不随寒烧尽，蝌文宁逐野磷枯。百年俎豆传芳谷，飒飒林飚动碧梧” 
孝堂夕照
清・史廷桂《孝堂夕照》：“曳手碑阴诵古铭，偶然樵径拜山灵。千重云树斜晖淡，石缕烟霞返照幂。儿为母埋情转返，金砖天赐事非轻。祗知孝德同山峙，芳草年年暖石亭” 
清河晚渡
明・徐一鹗《清河晚渡》：“迢迢路限通津远，弥弥河流拍岸清。估客来时归鸟没，篙师渡处片帆轻。棹歌摇曳空中发，渔笛凄凉柳外声。最是往来离别客，夕阳荒草总关情” 
山寺晨钟
明・陈尚仁《山寺晨钟》：“月隐高城漏已更，上方寂寂晓钟鸣。觉来顿洗胸襟累，听罢都忘宠辱惊。双涧微微和叶落，一林隐隐带霜清。行人莫问迟和早，明日同来听此声” 
陶洞清幽
清・史廷桂《陶洞清幽》：“偶寻幽迹问禅关，堙洞荆榛未可攀。鉴取鸱夷齐地客，智辞鸟喙越臣班。当年花雨因风违，此日松云渡水还。欲把麋踪吊西子，薜烟萝月满空山” 
鸾台月夜
明・林廷庸《鸾台月夜》：“擎天柱石矗云端，汉代曾闻集凤鸾。忆昔箫韶音断绝，祇今玉兔夜光寒。仙风吹绿生瑶草，蟾桂飘香散石坛。川岳効灵当盛世，九苞文彩镜中看”` },
            { name: "新泰", fu: "泰安府", jing: "新甫拥翠、汶水拖蓝、敖山削壁、磁窑晓雾、龙池秋月、灵岩瀑布、宫山夕照、羊流古渡", zhi: "新泰县志", dai: "乾隆", lng: 117.7400, lat: 35.9200, guwen: `新甫拥翠 山体层叠，植被茂密，四季青翠，有古寺古迹 明・公鼐《新甫山》：“新甫巍峨拥翠屏，千年古寺隐山灵。松涛满谷声如涛，一览群山入画屏”（载《新泰县志・艺文志》） 
汶水拖蓝 新泰市境内大汶河 河水清澈，阳光映照下如蓝绸飘动，岸柳依依 清・李希贤《汶水拖蓝》：“汶水拖蓝映碧天，轻舟短棹逐云边。两岸垂杨笼绿雾，渔歌互答夕阳前”（载《新泰风物大典》）  
敖山削壁 新泰市东北敖山 山崖陡峭如削，怪石嶙峋，登顶可俯瞰全城 明・于慎行《敖山》：“敖山削壁插云端，怪石嶙峋势若悬。登顶凭栏观远眺，一城烟火落阶前”（载《新泰古八景集》）  
磁窑晓雾 新泰市西磁窑镇 清晨古镇云雾缭绕，因古磁窑遗址得名，烟火气浓 清・牛运震《磁窑晓雾》：“磁窑晓雾锁烟村，古窑遗址记前痕。炊烟渐起晨光动，一片朦胧入画论”（载《新泰风物志》）  
龙池秋月 新泰市东南龙池村 池水平静，秋日明月倒映，岸边古柳低垂 明・边贡《龙池秋月》：“龙池秋月映清辉，柳影婆娑拂水湄。夜半风来波微动，一湖银浪碎琉璃”（载《新泰县志・艺文志》）  
灵岩瀑布 新泰市南灵岩山 山间瀑布飞流直下，水花四溅，声震山谷 清・施闰章《灵岩瀑布》：“灵岩瀑布挂前川，飞流直下势如颠。飞沫沾衣凉彻骨，清音满谷伴云眠”（载《新泰古八景考》）  
宫山夕照 新泰市北宫山 夕阳映照宫山，山体金黄，与晚霞相映 明・李流芳《宫山夕照》：“宫山夕照景尤佳，落日熔金映紫霞。归鸟投林烟渐起，牧童横笛过村家”（载《新泰风物大典》）  
羊流古渡 新泰市西北羊流镇 古渡因羊祜故里得名，商船往来，历史厚重 清・黄恩彤《羊流渡》：“羊流古渡溯渊源，故里风流忆晋贤。商船往来通南北，一篙春水渡流年”（载《新泰古八景集》）` },
            { name: "莱芜", fu: "泰安府", jing: "汶水西流、官山夕照、苍峡雷鸣、仙人遗迹、龙潭星现、棋山柯烂、矿山呈瑞、凤台秋月", zhi: "莱芜县志", dai: "民国", lng: 117.6700, lat: 36.2000, guwen: `汶水西流
清・张四教《汶水西流》：“汶水西来绕郭流，夕阳帆影落汀洲。莫言此去无归处，穿入黄河到海头” 
官山夕照
清・李九官《官山夕照》：“新甫山前落日悬，霞光染尽万松巅。城中烟火初明后，一片丹红映碧天” 
苍峡雷鸣
清・魏似韩《苍峡观瀑》：“绝壁飞流挂碧岑，雷声十里振林深。山僧倚杖松下立，疑有蛟龙出洞吟” 
仙人遗迹
明・吴来朝《游仙人洞》：“仙人一去几千年，洞锁烟霞石径偏。唯有古松含晚翠，清风时送鸟声传” 
龙潭星现
清・潘绍烈《夜宿黑龙潭》：“潭边夜宿听涛声，星斗垂天映水清。忽有渔舟横渡口，一灯明灭见归程” 
棋山柯烂
清・张梅亭《棋山怀古》：“王质仙踪何处寻，棋盘石上藓痕深。杜鹃开尽春山暮，犹有游人忆烂柯” 
矿山呈瑞
清・吕源《矿山晓望》：“矿山晓色郁苍苍，奇石嶙峋带露光。遥想汉时冶铸地，至今犹觉铁烟香” 
凤台秋月
明・王守身《凤台赏月》：“凤台高耸接云端，秋月当空照夜阑。荷风送香人欲醉，满城灯火夜漫漫” ` },
            { name: "东阿", fu: "泰安府", jing: "归台遗井、黄石仙踪、鱼山闻梵、礛山出云、狼溪春水、虎窟秋风、扈泉涌碧、洪范浮金", zhi: "东阿县志", dai: "道光", lng: 116.3000, lat: 36.3200, guwen: `归台遗井
民人归、诸侯归、四夷归
清・胡德琳《三归台怀古》“管相遗台枕碧流，井泉清冽至今留。九合诸侯成霸业，一匡天下著春秋。荒台衰草迷残碣，古邑斜阳照晚秋。独倚危栏思往事，齐疆千里忆风流。”
黄石仙踪
十三年后，济北谷城山黄石即我
明・于慎行《黄石山》“谷城山下黄石存，当年曾授子房恩。兵书一卷定天下，仙迹千年留故村。古柏凌霄侵汉碧，残碑映日带秦痕。登临不尽沧桑意，独对青山忆旧论。”
鱼山闻梵
尝游鱼山，闻岩岫有诵经声，清婉遒亮，遂仿其声制《太子颂》等梵呗，梵音与涛声相和。
三国・曹植《游鱼山》（残句）“晨游鱼山，暮宿鱼山。梵音绕岫，清响入云间。”
明・黄哲《过东阿鱼山》“鱼山高耸济河边，闻梵当年忆子建。古寺松涛传梵呗，长河落日泛秋烟。碑残犹记魏朝事，墓冷空留汉月悬。我欲登临寻旧迹，西风回首意茫然。”
礛山出云
晴日云起如浪，阴雨云凝如黛
清・魏光弼《登礛山》“礛山高耸接云端，晓日初升照翠峦。云气漫山如浪涌，松声绕谷似涛寒。东看湖色连天际，西望河光落镜盘。独倚危峰思远眺，一身疑在碧霄端。”
狼溪春水
两岸桃花开似雪，一河春水碧如油
佚名《狼溪春泛》“旧城对峙古东阿，中有狼溪一水沱。画出桥边好风景，两行云树浮春波。渔舟荡碎晴光里，牧笛吹残晓雾多。最是年年寒食后，桃花夹岸醉吟哦。”
明・于慎行《永济桥晓望》“狼溪晓涨碧潺潺，桥跨长虹锁翠湾。两岸柳烟笼客路，一篙春水渡人间。城边日出催耕早，渡口风来送桨还。
我欲乘舟寻胜境，满川烟雨正相关。”
虎窟秋风
每秋风起，洞中风声如涛，震彻山谷
清・张元《虎窟秋风》“虎窟山深风怒号，秋来声震若江涛。洞藏白虎云犹护，亭倚青峦日欲高。采药人归迷野径，听松客醉倚岩皋。谁言西麓无佳境，此地清幽胜二崂。”
扈泉涌碧
自下而上喷涌，触岩溅珠，状如飞雪
明・朱应毂《扈泉涌碧》“扈泉涌碧喷珠花，石壁题诗纪岁华。千载奔流常不竭，一潭澄翠映山霞。寒生古洞云长绕，冷浸苍崖月自斜。我愿此泉滋稼穑，丰年岁岁乐农家。”
清・许用中《扈泉观瀑》“飞泉泻玉下危崖，乱溅珠玑落碧潭。风送凉声穿树去，云随流水过桥南。岩前古字留残藓，谷口闲僧话旧庵。坐久忘归天欲暮，满林黄叶映秋岚。”
洪范浮金
旱涝不增减，恒温恒量
明・刘隅《洪范浮金》“洪范池开映碧空，投金浮彩漾长虹。泉通地脉千年润，光映天章五色融。亭畔松阴遮夏日，池边柳色弄春风。我来闲赏临清浅，疑是骊龙卧水中。”
清・秦云程《游洪范池》“龙池一勺漾清涟，投币浮光碎锦钿。泉自地灵千古秀，景因天巧四时妍。凉生石磴消残暑，影入菱花映碧天。莫道江南多胜境，此间风月亦堪怜。` },
            { name: "平阴", fu: "泰安府", jing: "碧峰仙迹、峻玉含辉、锦水秋萦、水山叠翠、杏坛遗响、石门晚照、吴溪沉月、天井飞泉", zhi: "平阴县志", dai: "嘉庆、光绪", lng: 116.4300, lat: 36.3300, guwen: "" },

            { name: "濮州", fu: "曹州府", jing: "杏岗春色、清潭明月、红沟绿岸、席桥横渡、春柳杨花、钓台阴雨、箕山独卧、谷林晚钟", zhi: "濮州志", dai: "宣统", lng: 115.4300, lat: 35.6000, guwen: "" },
            { name: "菏泽", fu: "曹州府", jing: "清邱烟柳、桂陵柿叶、双河晓月、历山春雨、雷泽秋风、灉水荷花、华驿归骑、兴化晨钟", zhi: "荷泽县志", dai: "光绪", lng: 115.4800, lat: 35.2400, guwen: "" },
            { name: "单县", fu: "曹州府", jing: "琴台夜月、吕井寒泉、栖霞晚照、涞河归帆、青冢暮云、古涞秋波、仙桥流水、汉台晓雾", zhi: "单县志", dai: "民国", lng: 116.0600, lat: 34.8200, guwen: `琴台夜月
月光映台，琴声似绕梁，荷风送香，池水映月如碎银
明・著名诗人 谢榛《琴台夜月》“宓子高台倚夜凉，月光如水映荷香。千年琴韵随风远，十里荷风绕郭长。竹影横斜笼石径，蛙声断续答渔榔。我来凭吊思遗泽，犹觉仁风满故乡。”
吕井寒泉
冬不冻、夏不涸，汲之烹茶，齿颊留香
清・单县知县 黄毓奎《吕井寒泉》“仙井幽深映碧天，寒泉一勺胜琼浆。石栏刻字留仙迹，玉甃流云映翠烟。夏日烹茶消酷暑，冬朝汲水漱清涎。我来一饮思遗事，犹想纯阳炼药年。”
栖霞晚照
霞光漫山，树影参差，如入画屏
清・单县举人 李树培《栖霞晚照》“栖霞山畔夕阳红，古寺疏钟送晚风。树影横斜凝暮色，霞光浮动映晴空。樵夫负薪归村晚，渔父收纶下钓同。我欲题诗留胜迹，醉扶藜杖立芳丛。”
涞河归帆
自春至秋，漕船往来不绝，傍晚归帆连樯，夕阳映帆如金
明・单县知县 夏维宁《涞河归帆》“涞河秋水碧悠悠，归帆片片映残秋。樯桅如林连远岸，橹声似乐逐轻流。桥边客立观霞落，渡口渔歌伴月浮。此境不输江南好，一川风月足清幽。”
青冢暮云
暮云笼罩时，冢如青黛，与晚霞相映
清・单县贡生 刘阶平《青冢暮云》“青冢峨峨倚暮云，松涛声里忆前勋。残碑漫灭留秦篆，古柏萧疏带汉氛。落日映霞凝紫翠，晚风拂草送清芬。我来凭吊情无限，独对荒丘思不群。”
古涞秋波
波映秋阳如碎金，两岸芦花泛白，柳丝拂波
清・单县文人 温应瑞《古涞秋波》“古涞秋水净无泥，波映秋阳碧似溪。芦花泛白随风舞，柳丝垂绿拂岸低。鱼戏浅滩惊鹭起，客凭危亭听莺啼。此中真意谁能解，醉卧扁舟任东西。”
仙桥流水
溪水潺潺，穿桥而过，春日柳丝垂岸，秋日枫叶映溪
明・单县教谕 周如砥《仙桥流水》“仙人桥畔水潺潺，流过平沙绕碧山。春日柳丝牵客袖，秋日枫叶落溪湾。寺钟送响随风远，渔笛吹残伴月还。我欲乘槎寻胜境，一篙清浅破烟寰。”
汉台晓雾
清晨晓雾缭绕，台影隐现如仙境
清・单县知县 王廷栋《汉台晓雾》“汉台高耸晓雾浓，平野苍茫望不穷。雾散日出澄千里，台空人去忆英雄。残碑尚记当年事，古柏犹含旧日风。我来登临思往事，满怀豪气贯长虹。”` },
            { name: "城武", fu: "曹州府", jing: "寿峰朝曛、云山夕照、郜鼎遗碑、梁丘胜迹、凤岭春云、雁池秋月、台泉灵润、河堤烟树", zhi: "城武县志", dai: "道光", lng: 115.8800, lat: 34.9600, guwen: "" },
            { name: "钜野", fu: "曹州府", jing: "麟渡古流、凤台孤峙、昌城烟雨、秦洞云霞、梵塔朝晖、莲池夜月、金山春晓、渔泽秋澄、潘溪晓渡", zhi: "钜野县志", dai: "道光", lng: 116.0800, lat: 35.3900, guwen: `麟渡古流：周季麟胡来，拙修春秋黄。河流万古存，麟名修不佚。——少棠。
凤台孤峙：台上凤飞去，凤去台不空。但看河阳树，多半是梧桐。——吕鹏云
昌城烟雨：烟雨古高平，苔深碣石隆。谁怜昌邑王，俎豆独龙遂。——吕鹏云
秦洞云霞：秦王真努力，作屋劈山巅。赫焰今何在，空留一洞烟。——一今宾
梵塔朝晖：宝塔出层城，朝霞少外明。龙蛇排雁宇，一一照题名。——吕鹏云
莲池夜月：明月泛金塘，朱华益带香，双岐疑苏秀，白日丽趿阳。——吕鹏云
金山春晓：造物开灵境，麟川第一山。踏青坡沌滇，身在蓝园畴。——少棠

            { name: "郓城", fu: "曹州府", jing: "盘沟夜月、线岭秋烟、荒塔云燕、廪丘雾市、独山樵唱、五岔渔歌、冷水芙蓉、七陵云树", zhi: "郓城县志", dai: "光绪", lng: 115.9300, lat: 35.5900, guwen: `盘沟夜月：细水清浅绕城，月光映之，更澄，遥睐秋烟。
线岭秋烟：柳色垂垂，如金秋，霁晓，尤有异色。

附：盘沟夜月 
一干古水抱城幽，曲岸双回划上游。堞影浮空出镜里，波声不断入琴流。人家树杪鱼龙夜，残露孤蒲鸿雁秋。滉漾千门回自照，半天明月下盘沟。
 
荒塔云燕
几盘断塔类层台，岁岁能招燕子来。不厌僧贫香积度，殷勤飞走复飞。
 
廪丘雾市
聚郓鲁鄙汉时升，千载犹多瑞蔼凝。无蜃如何有海市，遥瞻疑是彩云蒸。
 
潘溪晓渡
白石桥边古梵宫，绿柳深处有溪通。朝朝回舟晨兴渡，人在沧浪欸乃中。
 
梁渠凫影
百亩流沙傍水滨，蹁跹凫雁往来频。遥观疑是蟾蜍影，是影非光莫认真。
 
冷水芙蓉
曾游盘水赏芙蓉，十里香闻信不虚。此地却能成五色，依稀湖上莲花居。
 
线岭秋烟
岭因金柳得芳名，柳到秋来景倍清，烟锁垂条千万缕，轻风摇曳画难成。
 
七陵云树
丰碑古篆汉时文，遗迹谁传未得闻。郁郁苍苍千载树，半巢鸿鹄半烟云。 

五岔渔歌
河分五岔归芦州，岸口渔家聚上流。夜静何声惊客梦，高歌都在渔舟中。 
独山樵夫
孤峰独耸势峥嵘，路仄偏多樵子行。朝采暮还能自乐，紫芝亦曲少一庚。` },
            {
                name: "曹县", fu: "曹州府",
                jing: "（光绪）玉带横桥、左山古寺、文笔冲霄、金堤烟柳、楚丘牧笛、莱墓神柏、龙潭月色、牛市青芜\n（康熙）汤陵异木、莘野春耘、景山夕翠、霸主盟坛、驿寺新塔、九曲洪涛、奎阁凌云、莱墓神柏",
                zhi: "曹县志", dai: "康熙、光绪", lng: 115.5300, lat: 34.8200, guwen: `玉带横桥：城内水四围，周遭各方有桥。

附：莱墓神柏
古冢碑前柏影森，历经风雨守贞心。
鳞纹似诉前朝事，翠色长怀将相音。
霜雪难摧千古志，春秋不改百年阴。
每思贤相功勋著，仰止高枝意自深。
 
左山古寺
古寺深藏翠谷中，梵音袅袅韵无穷。
禅房花木春常在，石径苔痕岁月融。
暮鼓晨钟醒世梦，青灯黄卷伴僧翁。
左山胜境清幽处，静悟禅机意万重 。
 
玉带横桥
碧水如绸绕巷间，小桥横卧似弓弯。
波光潋滟摇疏影，桥影玲珑映绿湾。
两岸人家烟火盛，一泓秀色画图闲。
往来皆醉清幽景，忘却尘嚣心自闲。
 
金堤烟柳
古堤延绵柳丝垂，袅袅轻烟映日晖。
翠影随风摇碧浪，柔条拂水弄晴晖。
曾遮黄河千层浪，常伴春禽几处飞。
漫步堤边诗意满，如烟美景不思归 。
 
龙潭月色
龙潭澄澈映苍穹，月洒银辉波影融。
水面光摇星几点，潭心璧落韵无穷。
鱼游浅底逐明月，蛙鼓幽林和晚风。
此夜清幽如梦画，一潭月色醉诗翁。
 
牛市青芜
平芜绿野漫牛羊，集市喧嚣映暖阳。
草色青青铺锦绣，牧歌阵阵韵悠长。
交易声中生计旺，悠闲境里岁华昌。
古风犹存田园景，一派祥和入画章。
 
楚丘牧笛
楚丘郊外草萋萋，牧子横笛落日西。
曲韵悠扬传四野，笛声婉转惹莺啼。
风吹碧浪牛羊隐，云卷晴空草木齐。
此景悠然添意趣，田园牧歌醉心迷 。
 
文笔冲霄 
巨石巍峨立学宫，宛如文笔刺苍穹。
历经风雨文光聚，承载春秋墨韵浓。

            { name: "定陶", fu: "曹州府", jing: "柳河春浪、萧寺曙钟、长岸烟迷、仿山雪霁、河滨渔唱、塔院梵音、石井月华、斑枝麟迹", zhi: "定陶县志", dai: "民国", lng: 115.5700, lat: 35.1000, guwen: "" },
            { name: "范县", fu: "曹州府", jing: "顾城春色、羊角秋风、古塔晴晖、宝刹横云、贤冢余香、龙潭烟雨、东郭清流、秦台晚照", zhi: "曹州府志", dai: "乾隆", lng: 115.4700, lat: 35.9000, guwen: "" },
            { name: "观城", fu: "曹州府", jing: "弇庙灵泉、文杏词坛、卫河新涨、木棉花市、魁楼耸秀、鲧堤春柳、仙冢传奇、鹤署古槐", zhi: "观城县志", dai: "道光", lng: 115.5000, lat: 36.2000, guwen: `弇庙灵泉
古刹清幽掩翠丛，灵泉一脉韵玲珑。
波摇日影金鳞动，泽润苍生瑞气融。
仙迹遥传尘世里，梵音长绕水云中。
凭栏欲觅源头处，唯有潺潺意未穷。

文杏词坛
文杏堂前忆俊贤，词章璀璨映长天。
当年雅咏才情溢，此际遗踪韵事传。
杏树繁花空寂寞，骚人胜迹久绵延。
徘徊故址寻芳迹，唯有清风伴夕烟。

卫河新涨
卫水汤汤涨绿波，新流浩渺映晴莎。
帆樯影动渔舟乱，云树光摇野岸多。
曾记漕粮千里运，犹闻战鼓百年过。
凭栏独倚思今古，浩浩奔腾唱赞歌。
 
木棉花市
木棉绽放映天红，市肆繁华古韵浓。
簇簇琼花迎远客，声声叫卖伴熏风。
昔年盛景依稀在，今日新姿烂漫融。
漫步街头寻旧忆，琳琅满目意无穷。
 
魁楼耸秀 
魁楼高耸入青云，秀影凌空绝世尘。
画栋雕梁昭盛景，飞檐斗拱忆前人。
文风蔚起千秋韵，士气昂扬百代春。
仰首瞻观情不禁，悠扬雅颂绕梁津。
 
鲧堤春柳 
鲧堤逶迤柳丝长，翠影婆娑映野塘。
春日柔条风里舞，清宵淡月水边藏。
曾闻禹迹留千古，犹记民劳筑巨防。
漫步堤边寻胜迹，悠悠岁月韵流芳。
 
仙冢传奇 
仙冢迷离故事传，荒丘寂寂伴寒烟。
千年岁月埋幽骨，万载风云绕墓田。
传说神奇添韵致，声名远播忆英贤。
徘徊冢畔思今古，唯见青山落日圆。
 
鹤署古槐 
鹤署门前古槐苍，虬枝铁干历沧桑。
浓阴蔽日千秋秀，翠叶摇风夏日凉。

            { name: "朝城", fu: "曹州府", jing: "金莲耀日、宝塔朝烟、石燕飞雨、沂岸垂虹、冠山耸翠、武水紫纡、丹霄月夜、八槐共本", zhi: "朝城县志", dai: "光绪", lng: 115.6000, lat: 36.1000, guwen: `金莲耀日：池在宁国寺，前以其花开皆黄，故名。邑人岳万全诗：绿叶摇摇擎晓露，金光灿灿映朝阳。芳心独秀真君子，一阵风来扑面香。
宝塔朝烟：塔在宁国寺，邑土有登第者，塔上预多瑞气。古有诗：凌空七极临云梯，孤柱擎天望眼迷。岚气葱笼连台斗，魁名取次雁塔题。
石燕飞雨：燕出宁国寺，井过阴雨，则井雨雨，飞出行具燕形，能寥诸病。邑台虞公道隆诗：阿谁陛此井水底，隐琅玕迎露气先。勤拂云趟并傅陛，埃须类石和乐可，成丹锻炼相逢日。
沂岸垂虹:迎薰门外东南，沂水经流，朝阳照映，最为奇发。古有诗：朝阳东映玉虹西，饮涧横流影渐迷。回首秋风天路近，飞梁千尺接云梯。
冠山耸翠：山虽土丘，然关陵突起，草木葱茏，寻芳胜地也。邑人谢诖诗：冠石山头春草生，春风山上接云横。踏遍春山与春草，风云双履遍多情。
武水紫纡：流曲源清，沁人心魂。谢诖诗：十里沙平过武溪，山空近在武溪西。春游邽怪连朝雨，水满溪桥浸大堤。
丹霄月夜：地势宽敞，殿宇清幽，月夜步之，恍若置身蓬瀛间。谢诖诗：赤雾彤烟晓未开，丹霄楼观彭崔巍。夜深明月瑶台静，羽士霓裳驾鹤来。
八槐共本：相传同根八株，大十余园荫，可里许。古有诗：林木童童百二尺，周旋连抱十余园。同根共生花毕异，即是天工别样培。` }
        ];

        // 渲染目录
        const fuGroup = {};
        points.forEach(p => {
            if (!fuGroup[p.fu]) fuGroup[p.fu] = [];
            fuGroup[p.fu].push(p);
        });

        const sb = document.getElementById('sidebar');
        const markerMap = {};

        for (let fu in fuGroup) {
            const fuTitle = document.createElement('div');
            fuTitle.className = 'fu-title';
            fuTitle.style.borderLeftColor = colorMap[fu] || '#999';
            fuTitle.innerHTML = `${fu} <span class="arrow">▶</span>`;
            sb.appendChild(fuTitle);

            const fuContent = document.createElement('div');
            fuContent.className = 'fu-content';
            sb.appendChild(fuContent);

            fuTitle.onclick = () => {
                fuTitle.classList.toggle('open');
                fuContent.classList.toggle('open');
            };

            fuGroup[fu].forEach(p => {
                const div = document.createElement('div');
                div.className = 'item';
                div.textContent = p.name;
                div.onclick = () => {
                    closeSidebarOnMobile();
                    map.setView([p.lat, p.lng], 12);
                    setTimeout(() => markerMap[p.name + ',' + p.fu].openPopup(), 300);
                    // 同时显示古籍
                    showGuwen(p.name, p.fu, p.guwen || '');
                };
                fuContent.appendChild(div);
            });
        }

        // 稳定彩色圆点标记
        points.forEach(p => {
            const color = colorMap[p.fu] || '#3182ce';
            const m = L.circleMarker([p.lat, p.lng], {
                radius: 6,
                fillColor: color,
                color: '#fff',
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(map);

            markerMap[p.name + ',' + p.fu] = m;
            m.bindPopup(`
                <div class="popup">
                    <div class="popup-title">${p.fu} · ${p.name}</div>
                    <div class="popup-info">${p.zhi}｜${p.dai}</div>
                    <div class="popup-content">${p.jing}</div>
                </div>`);
            // 地图标记点击事件
            m.on('click', () => {
                showGuwen(p.name, p.fu, p.guwen || '');
            });
        });
    </script>
